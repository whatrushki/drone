version: '3.8'

services:
  geoscan-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geoscan_fleet_commander
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
